name: 每日資料更新

on:
  schedule:
    - cron: '40 13 * * 1-5'
    - cron: '30 0 * * 2-6'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy openpyxl
      - name: 抓資料並更新兩個雷達
        id: upd
        continue-on-error: true
        run: python scripts/daily.py
      - name: 存檔(有變動才提交)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site
          if git diff --cached --quiet; then echo "沒有變動"; else
            git commit -m "每日資料更新 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
            git pull --rebase
            git push
          fi
      - name: 有步驟出錯時標示為失敗(GitHub 會寄信通知)
        if: steps.upd.outcome == 'failure'
        run: |
          echo "有步驟出錯,請展開上面「抓資料並更新兩個雷達」看摘要"
          exit 1

  deploy:
    needs: update
    if: always()
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
